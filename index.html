<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>🧮 Calculadora de Promedio</h1>
        
        <p class="subtitle">Ingresa tus notas para calcular tu promedio</p>

        <form id="gradeForm">

            <label for="grades">Notas (separadas por coma)</label>
            <input type="text" id="grades" placeholder="Ej: 80, 75, 90">

            <button type="submit">Calcular promedio</button>
            <p id="errorMessage" class="error"></p>
        </form>
        <section id="resultSection" class="result hidden">
            <h2>Resultado</h2>
            <p id="resultText"></p>
        </section>
    </main>
    <script src="grades.js"></script>
    <script src="script.js"></script>
</body>
</html>
